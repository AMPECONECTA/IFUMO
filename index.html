<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#56c900">
<title>Desafio Livre — parar de fumar juntos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7faf8;--surface:#fff;--surface2:#eef5f0;--text:#26322a;--muted:#718078;--border:#dce7df;
  --green:#58cc02;--greenD:#46a302;--blue:#1cb0f6;--blueD:#168fc7;--gold:#ffc800;--goldD:#d4a900;
  --red:#ff4b4b;--orange:#ff9600;--purple:#ce82ff;--nav:82px;
}
:root[data-theme="dark"]{--bg:#0f1712;--surface:#17211a;--surface2:#1f2c23;--text:#f2f7f3;--muted:#9eb0a3;--border:#304035}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-bottom:2px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}.logo{width:46px;height:46px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:1000;box-shadow:0 5px 0 var(--greenD)}
.brand small{display:block;font-size:.63rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.07em}.brand strong{display:block;font-size:1.18rem;letter-spacing:-.04em}.brand strong span{color:var(--greenD)}
.headActions{display:flex;gap:7px}.iconBtn{width:44px;height:44px;border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--text);font-weight:1000}.iconBtn:active{transform:translateY(2px);border-bottom-width:2px}
main{padding:14px 14px calc(var(--nav) + 28px)}.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}.pageHead h2{margin:0;font-size:1.5rem;letter-spacing:-.04em}.pageHead p{margin:3px 0 0;color:var(--muted);font-size:.84rem}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:2px solid var(--border);border-radius:999px;background:var(--surface);font-size:.7rem;font-weight:1000}
.topStats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;background:var(--surface);font-weight:1000;font-size:.84rem}.stat.fire{color:var(--orange)}.stat.xp{color:var(--blue)}.stat.people{color:var(--greenD)}
.hero{position:relative;overflow:hidden;padding:18px;border-radius:24px;background:linear-gradient(145deg,var(--green),#78df29);color:#fff;border-bottom:6px solid var(--greenD)}.hero h2{margin:0;max-width:78%;font-size:1.38rem;letter-spacing:-.04em}.hero p{margin:5px 0 0;max-width:78%;font-size:.85rem;color:rgba(255,255,255,.9);line-height:1.45}.heroIcon{position:absolute;right:13px;bottom:-8px;font-size:4rem;transform:rotate(-8deg)}.progress{height:12px;background:rgba(127,127,127,.18);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:inherit;transition:.25s}.hero .progress{max-width:72%;margin-top:13px;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.2)}.hero .progress span{background:#fff}.heroFoot{margin-top:6px;font-size:.7rem;font-weight:900}
.section{margin-top:18px}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:10px}.sectionHead h3{margin:0;font-size:1.02rem}.sectionHead span{color:var(--muted);font-size:.72rem;font-weight:800}
.card{background:var(--surface);border:2px solid var(--border);border-bottom-width:4px;border-radius:18px;padding:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px;border-radius:15px;background:var(--surface2)}.metric strong{display:block;font-size:1.08rem}.metric small{display:block;color:var(--muted);font-weight:800;margin-top:2px}
.btn{min-height:46px;border-radius:14px;padding:10px 13px;border:2px solid transparent;border-bottom-width:4px;font-weight:1000;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:active{transform:translateY(2px);border-bottom-width:2px}.btnGreen{background:var(--green);color:#fff;border-bottom-color:var(--greenD)}.btnBlue{background:var(--blue);color:#fff;border-bottom-color:var(--blueD)}.btnGold{background:var(--gold);color:#624a00;border-bottom-color:var(--goldD)}.btnGhost{background:var(--surface);color:var(--text);border-color:var(--border);border-bottom-color:#cbd5cf}.btnRed{background:color-mix(in srgb,var(--red) 10%,var(--surface));color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--border));border-bottom-color:color-mix(in srgb,var(--red) 40%,var(--border))}.btnBlock{width:100%}.actions{display:grid;gap:9px}
.form{display:grid;gap:10px}.formRow{display:grid;gap:6px}.formRow label{font-size:.75rem;font-weight:900;color:var(--muted)}.input{width:100%;min-height:46px;padding:11px 12px;border-radius:13px;border:2px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-size:16px}.input:focus{border-color:var(--green)}textarea.input{min-height:90px;resize:vertical}
.notice{padding:12px;border:2px solid color-mix(in srgb,var(--blue) 24%,var(--border));border-radius:14px;background:color-mix(in srgb,var(--blue) 8%,var(--surface));color:var(--muted);font-size:.8rem;line-height:1.45}
.emergency{position:relative;overflow:hidden;text-align:center;padding:20px;background:linear-gradient(145deg,#ff695f,var(--red));border:0;border-bottom:6px solid #d73d3d;color:#fff}.emergency h3{font-size:1.35rem;margin:0}.emergency p{margin:6px auto 14px;max-width:500px;color:rgba(255,255,255,.9);font-size:.84rem;line-height:1.45}.emergency .btn{background:#fff;color:#c93434;border-bottom-color:#e7d7d7;width:100%}
.challengePanel{text-align:center}.timer{width:176px;height:176px;margin:8px auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:8px solid var(--green);box-shadow:inset 0 0 0 3px var(--surface)}.timer strong{display:block;font-size:2.15rem;letter-spacing:-.05em}.timer small{display:block;color:var(--muted);font-weight:900}.exerciseIcon{font-size:2.6rem}.exerciseText{max-width:520px;margin:8px auto 14px;color:var(--muted);line-height:1.5}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale label{cursor:pointer}.scale input{position:absolute;opacity:0}.scale span{min-height:44px;border:2px solid var(--border);border-bottom-width:4px;border-radius:12px;display:grid;place-items:center;background:var(--surface);font-weight:1000}.scale input:checked+span{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--surface));color:var(--greenD)}
.therapyDay{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}.therapyDay:last-child{border-bottom:0}.dayIcon{width:48px;height:48px;border-radius:15px;background:var(--surface2);display:grid;place-items:center;font-size:1.25rem}.therapyDay strong{display:block}.therapyDay p{margin:3px 0 0;color:var(--muted);font-size:.78rem;line-height:1.42}.therapyDay.today{background:color-mix(in srgb,var(--green) 7%,var(--surface));margin:0 -8px;padding:12px 8px;border-radius:14px}.therapyDay.done .dayIcon{background:color-mix(in srgb,var(--green) 15%,var(--surface));color:var(--greenD)}
.feedComposer{display:grid;gap:9px}.photoPreview{width:100%;max-height:320px;object-fit:cover;border-radius:14px;border:2px solid var(--border)}.feed{display:grid;gap:11px}.post{background:var(--surface);border:2px solid var(--border);border-bottom-width:4px;border-radius:18px;overflow:hidden}.postBody{padding:13px}.author{display:flex;align-items:center;gap:9px}.avatar{width:40px;height:40px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:1.2rem;font-weight:1000}.author strong{display:block}.author small{display:block;color:var(--muted);font-size:.7rem}.postText{margin:10px 0 0;white-space:pre-wrap;line-height:1.45;font-size:.9rem}.post img{display:block;width:100%;max-height:420px;object-fit:cover;background:var(--surface2)}.postActions{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:1px solid var(--border)}.supportBtn{border:0;background:transparent;color:var(--muted);font-weight:1000}.supportBtn.active{color:var(--greenD)}
.liveItem{display:grid;grid-template-columns:42px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}.liveItem:last-child{border-bottom:0}.liveIcon{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center}.liveItem strong{display:block;font-size:.84rem}.liveItem small{display:block;color:var(--muted);margin-top:2px;line-height:1.35}
.peopleList{display:grid;gap:9px}.person{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:2px solid var(--border);border-radius:15px}.personMain{display:flex;align-items:center;gap:10px}.onlineDot{width:9px;height:9px;border-radius:50%;background:#b6c0ba}.onlineDot.on{background:var(--green)}
.bottomNav{position:fixed;z-index:35;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);min-height:var(--nav);padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:color-mix(in srgb,var(--surface) 95%,transparent);border-top:2px solid var(--border);backdrop-filter:blur(18px)}.navBtn{border:0;background:transparent;min-height:58px;border-radius:14px;color:var(--muted);font-weight:1000;font-size:.66rem}.navIcon{width:32px;height:32px;margin:auto;display:grid;place-items:center;border-radius:11px;font-size:1.05rem}.navBtn.active{color:var(--greenD)}.navBtn.active .navIcon{background:color-mix(in srgb,var(--green) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--green) 30%,var(--border))}
.modalBg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center;padding:14px}.modal{width:min(100%,640px);max-height:90vh;overflow:auto;background:var(--surface);border:2px solid var(--border);border-radius:25px;padding:18px}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px}.modalHead h3{margin:0}
.toastWrap{position:fixed;z-index:130;left:50%;top:76px;transform:translateX(-50%);width:min(92vw,480px);display:grid;gap:8px}.toast{padding:12px 14px;border-radius:14px;background:#203527;color:#fff;font-size:.84rem;font-weight:800;animation:tin .2s ease}@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.rewardWrap{position:fixed;inset:0;z-index:150;pointer-events:none;display:grid;place-items:center}.reward{padding:18px 24px;border:3px solid var(--gold);border-bottom-width:7px;border-radius:22px;background:var(--surface);text-align:center;font-weight:1000;animation:reward .9s ease both}.reward i{font-style:normal;font-size:2.6rem;display:block}.reward b{display:block;color:var(--blue);font-size:1.2rem}@keyframes reward{0%{transform:scale(.7);opacity:0}30%{transform:scale(1.08);opacity:1}72%{transform:scale(1);opacity:1}100%{opacity:0}}
.authShell{max-width:480px;margin:32px auto}.authHero{text-align:center;padding:18px}.authHero .bigLogo{width:82px;height:82px;margin:0 auto 14px;border-radius:26px;background:var(--green);box-shadow:0 7px 0 var(--greenD);display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:1000}.authHero h1{margin:0;letter-spacing:-.05em}.authHero p{color:var(--muted);line-height:1.5;font-size:.85rem}
.hidden{display:none!important}.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
.setup{max-width:600px;margin:24px auto}.setup code{word-break:break-all}.statusOk{color:var(--greenD)}.statusBad{color:var(--red)}
@media(max-width:430px){.topStats{gap:5px}.stat{font-size:.73rem}.grid3{grid-template-columns:1fr}.therapyDay{grid-template-columns:48px 1fr}.therapyDay .badge{grid-column:2}.hero h2,.hero p{max-width:74%}}
@media(max-width:360px){.grid2{grid-template-columns:1fr}.scale{gap:4px}.brand small{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">DL</div><div><small>Soldado · Pedro · Tainá</small><strong>Desafio <span>Livre</span></strong></div></div>
  <div class="headActions"><button class="iconBtn" id="themeBtn" aria-label="Tema">◐</button><button class="iconBtn hidden" id="logoutBtn" aria-label="Sair">↪</button></div>
</header>
<main id="main"></main>
<nav class="bottomNav hidden" id="nav">
  <button class="navBtn" data-route="today"><span class="navIcon">🏠</span>Hoje</button>
  <button class="navBtn" data-route="therapy"><span class="navIcon">🧠</span>Plano</button>
  <button class="navBtn" data-route="craving"><span class="navIcon">🛟</span>Vontade</button>
  <button class="navBtn" data-route="feed"><span class="navIcon">💬</span>Feed</button>
  <button class="navBtn" data-route="group"><span class="navIcon">👥</span>Grupo</button>
</nav>
</div>
<div class="toastWrap" id="toastWrap" aria-live="polite"></div>
<div id="modalRoot"></div>
<input id="photoInput" type="file" accept="image/*" hidden>
<script>
"use strict";

/* ============================================================
   CONFIGURAÇÃO
   Pode deixar placeholders no GitHub e informar URL/chave
   pela tela de instalação. A publishable/anon key pode ficar
   no navegador quando RLS está corretamente configurado.
============================================================ */
const APP={
  startDate:"2026-09-05",
  supabaseUrl:"__SUPABASE_URL__",
  supabaseKey:"__SUPABASE_PUBLISHABLE_KEY__",
  localConfigKey:"desafiolivre.supabase.v1",
  themeKey:"desafiolivre.theme",
  challengeMinutes:[5,5,10,15],
  photoBucket:"feed-photos"
};

const THERAPY=[
  {d:1,icon:"🧹",title:"Limpar o terreno",text:"Retire cigarros, isqueiros e cinzeiros do alcance. Escreva 3 motivos para parar. Se vier vontade, faça um bloco de 5 minutos no botão Vontade."},
  {d:2,icon:"🔎",title:"Mapear gatilhos",text:"Registre cada vontade: café, estresse, depois de comer, álcool/social, tédio ou hábito automático. Não precisa combater tudo de uma vez; apenas reconheça o padrão."},
  {d:3,icon:"💧",title:"Água + respiração",text:"Em pelo menos 2 vontades, beba água devagar e faça 10 respirações lentas antes de decidir qualquer coisa."},
  {d:4,icon:"🚶",title:"Trocar o contexto",text:"Faça 5 a 10 minutos de caminhada ou mude de ambiente quando aparecer um gatilho forte. O objetivo é quebrar a associação automática."},
  {d:5,icon:"☕",title:"Mudar uma rotina",text:"Escolha um gatilho frequente, como café ou pós-refeição, e substitua a sequência: escovar os dentes, caminhar, chá ou outro ritual sem cigarro."},
  {d:6,icon:"💬",title:"Usar o grupo",text:"Publique no feed uma dificuldade real e uma pequena vitória. Apoiar e pedir apoio faz parte do desafio."},
  {d:7,icon:"🏅",title:"Fechar a primeira semana",text:"Revise os gatilhos que mais apareceram e escolha os 2 exercícios que melhor funcionaram. Faça uma recompensa simples com parte do dinheiro economizado."},
  {d:8,icon:"🧠",title:"Responder ao pensamento",text:"Quando surgir “só um”, escreva: o que eu espero que esse cigarro resolva? O que posso testar por 5 minutos antes? Use o cronômetro."},
  {d:9,icon:"✋",title:"Ocupar mãos e boca",text:"Deixe uma alternativa disponível: água, goma sem açúcar, objeto para as mãos ou pequena tarefa manual. Use antes do impulso automático."},
  {d:10,icon:"🏃",title:"Movimento curto",text:"Faça pelo menos 10 minutos de atividade possível para você: caminhada, escadas leves ou alongamento ativo. O objetivo é atravessar o período de vontade."},
  {d:11,icon:"🗣️",title:"Ensaiar situações sociais",text:"Prepare uma frase curta para quando oferecerem cigarro: “não, estou no desafio”. Se houver álcool como gatilho, planeje reduzir ou evitar no começo."},
  {d:12,icon:"🧯",title:"Plano para deslize",text:"Defina antes: se eu fumar, registro o gatilho, descarto o restante e volto ao desafio no próximo minuto — sem transformar um cigarro em abandono do plano."},
  {d:13,icon:"🌱",title:"Notar mudanças",text:"Registre 3 mudanças percebidas: rotina, cheiro, paladar, respiração, dinheiro, sono ou sensação de controle. Não precisa sentir todas."},
  {d:14,icon:"🏆",title:"Plano de manutenção",text:"Escolha seus 3 maiores gatilhos, sua resposta para cada um e quem você chama quando a vontade estiver alta. Continue usando os blocos curtos quando necessário."}
];

const EXERCISES=[
  {key:"water",icon:"💧",title:"Água + mudança",text:"Beba um copo de água devagar e vá para outro cômodo ou local. Não decida fumar até o cronômetro terminar."},
  {key:"breath",icon:"🌬️",title:"10 respirações lentas",text:"Inspire pelo nariz e solte o ar lentamente pela boca. Repita 10 vezes, sem forçar a respiração."},
  {key:"walk",icon:"🚶",title:"Caminhada curta",text:"Caminhe por alguns minutos ou suba/desça alguns lances confortáveis. Mantenha-se em movimento até a onda diminuir."},
  {key:"hands",icon:"✋",title:"Mãos ocupadas",text:"Pegue uma caneta, lave algo, organize uma gaveta ou use outra tarefa manual curta. O objetivo é quebrar o automático."},
  {key:"support",icon:"💬",title:"Chame alguém",text:"Abra o Feed e escreva uma frase sobre o que está sentindo. Você também pode mandar mensagem para alguém de confiança."},
  {key:"mouth",icon:"🍎",title:"Troque a sensação",text:"Use água, goma sem açúcar ou um alimento simples e mude o sabor da boca. Se acabou de comer, escovar os dentes pode ajudar."}
];

const TRIGGERS=["Café","Estresse","Depois de comer","Álcool / social","Tédio","Ansiedade","Dirigir","Trabalho / pausa","Hábito automático","Outro"];

const Util={
  esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))},
  iso(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},
  dateBR(iso){if(!iso)return"";const [y,m,d]=iso.split("-");return `${d}/${m}/${y}`},
  num(v,f=0){const n=Number(v);return Number.isFinite(n)?n:f},
  money(v){return Util.num(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})},
  diffDays(a,b){return Math.floor((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)},
  relTime(ts){const s=Math.max(0,Math.floor((Date.now()-new Date(ts).getTime())/1000));if(s<60)return"agora";if(s<3600)return`${Math.floor(s/60)} min`;if(s<86400)return`${Math.floor(s/3600)} h`;return Util.dateBR(ts.slice(0,10))}
};

const State={
  client:null,user:null,member:null,members:[],posts:[],events:[],reactions:[],therapy:[],presence:{},route:"today",
  activeSession:null,activeRound:null,timerId:null,timerEnd:null,selectedPhoto:null,signedCache:new Map()
};

const UI={
  toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.getElementById("toastWrap").appendChild(e);setTimeout(()=>e.remove(),2600)},
  reward(msg,emoji="⭐"){const w=document.createElement("div");w.className="rewardWrap";w.innerHTML=`<div class="reward"><i>${emoji}</i><b>${Util.esc(msg)}</b></div>`;document.body.appendChild(w);setTimeout(()=>w.remove(),950)},
  modal(title,body,actions=""){document.getElementById("modalRoot").innerHTML=`<div class="modalBg" id="modalBg"><section class="modal" role="dialog" aria-modal="true"><div class="modalHead"><h3>${Util.esc(title)}</h3><button class="iconBtn" data-close>×</button></div>${body}${actions?`<div style="height:1px;background:var(--border);margin:14px 0"></div><div class="actions">${actions}</div>`:""}</section></div>`},
  close(){document.getElementById("modalRoot").innerHTML=""}
};

function getConfig(){
  const local=JSON.parse(localStorage.getItem(APP.localConfigKey)||"{}");
  return {
    url:APP.supabaseUrl.startsWith("__")?(local.url||""):APP.supabaseUrl,
    key:APP.supabaseKey.startsWith("__")?(local.key||""):APP.supabaseKey
  };
}
function configReady(){const c=getConfig();return /^https:\/\/.+\.supabase\.co$/.test(c.url)&&c.key.length>20}
function initClient(){
  if(!configReady())return false;
  const c=getConfig();
  State.client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return true;
}
function applyTheme(){document.documentElement.dataset.theme=localStorage.getItem(APP.themeKey)||"light"}
function dayNumber(){
  const n=Util.diffDays(APP.startDate,Util.iso())+1;
  return Math.max(0,Math.min(14,n));
}
function startReached(){return Util.iso()>=APP.startDate}
function ownTherapyFor(day){return State.therapy.find(x=>x.day_number===day)}
function completedTherapy(){return State.therapy.filter(x=>x.completed).length}
function cigarettesAvoided(member=State.member){
  if(!member)return 0;
  const days=Math.max(0,Util.diffDays(member.quit_date||APP.startDate,Util.iso()));
  return days*Util.num(member.baseline_cigs_per_day,0);
}
function savedMoney(member=State.member){
  if(!member)return 0;
  const per=Util.num(member.pack_price,0)/Math.max(1,Util.num(member.cigarettes_per_pack,20));
  return cigarettesAvoided(member)*per;
}
function daysWithout(member=State.member){
  if(!member)return 0;
  const start=member.quit_date||APP.startDate;
  const lastSlip=member.last_slip_at?.slice(0,10);
  const base=lastSlip&&lastSlip>=start?lastSlip:start;
  return Math.max(0,Util.diffDays(base,Util.iso()));
}
function xp(){
  const therapy=completedTherapy()*20;
  const completedRounds=Util.num(State.member?.completed_rounds,0)*10;
  const posts=State.posts.filter(p=>p.member_id===State.member?.id).length*5;
  return therapy+completedRounds+posts;
}
function level(){return Math.floor(xp()/150)+1}
function challengeDuration(roundNo){return APP.challengeMinutes[Math.min(roundNo-1,APP.challengeMinutes.length-1)]}
function exerciseFor(roundNo,intensity){
  const offset=(intensity>=4?1:0);
  return EXERCISES[(roundNo-1+offset)%EXERCISES.length];
}

async function login(email,password){
  if(!email||password.length<6){UI.toast("Informe e-mail e senha válidos.");return}
  const {error}=await State.client.auth.signInWithPassword({email,password});
  if(error)UI.toast(error.message);else await bootAuthenticated()
}
async function signup(email,password){
  if(!email||password.length<6){UI.toast("Use um e-mail válido e senha com pelo menos 6 caracteres.");return}
  const {data,error}=await State.client.auth.signUp({email,password});
  if(error){UI.toast(error.message);return}
  if(data.session){await bootAuthenticated()}else UI.toast("Conta criada. Confirme o e-mail se o projeto exigir confirmação.")
}
async function logout(){clearRealtime();await State.client.auth.signOut();State.user=null;State.member=null;renderAuth()}

async function bootAuthenticated(){
  const {data:{user}}=await State.client.auth.getUser();
  State.user=user;
  if(!user){renderAuth();return}
  const {data:member,error}=await State.client.from("members").select("*").eq("auth_user_id",user.id).maybeSingle();
  if(error){UI.toast(error.message);return}
  State.member=member;
  if(!member){renderClaim();return}
  await loadAll();setupRealtime();setupPresence();document.getElementById("nav").classList.remove("hidden");document.getElementById("logoutBtn").classList.remove("hidden");Router.render()
}
async function loadAll(){
  if(!State.member)return;
  const [members,posts,events,reactions,therapy,stats,privateState]=await Promise.all([
    State.client.from("members").select("id,display_name,avatar_emoji,quit_date,baseline_cigs_per_day,pack_price,cigarettes_per_pack,created_at").order("display_name"),
    State.client.from("posts").select("id,member_id,body,photo_path,created_at,members(display_name,avatar_emoji)").order("created_at",{ascending:false}).limit(50),
    State.client.from("activity_events").select("id,member_id,event_type,message,created_at,members(display_name,avatar_emoji)").order("created_at",{ascending:false}).limit(50),
    State.client.from("post_reactions").select("id,post_id,member_id,kind"),
    State.client.from("therapy_progress").select("*").eq("member_id",State.member.id).order("day_number"),
    State.client.rpc("member_public_stats"),
    State.client.from("member_private_state").select("last_slip_at").eq("member_id",State.member.id).maybeSingle()
  ]);
  if(members.error)throw members.error;State.members=members.data||[];
  const own=State.members.find(x=>x.id===State.member.id);if(own)State.member={...State.member,...own};
  State.posts=posts.data||[];State.events=events.data||[];State.reactions=reactions.data||[];State.therapy=therapy.data||[];
  const me=(stats.data||[]).find(x=>x.member_id===State.member.id);
  if(me)State.member={...State.member,...me};
  if(privateState?.data)State.member={...State.member,...privateState.data};
  await hydratePhotos();
}
async function hydratePhotos(){
  const jobs=State.posts.filter(p=>p.photo_path&&!State.signedCache.has(p.photo_path)).map(async p=>{
    const {data}=await State.client.storage.from(APP.photoBucket).createSignedUrl(p.photo_path,3600);
    if(data?.signedUrl)State.signedCache.set(p.photo_path,data.signedUrl)
  });
  await Promise.all(jobs)
}
function clearRealtime(){if(State.client)State.client.removeAllChannels();State.presence={}}
function setupRealtime(){
  State.client.channel("challenge-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"posts"},async()=>{await refreshFeed();if(State.route==="feed")Router.render()})
    .on("postgres_changes",{event:"*",schema:"public",table:"post_reactions"},async()=>{await refreshReactions();if(State.route==="feed")Router.render()})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"activity_events"},async()=>{await refreshEvents();if(State.route==="today"||State.route==="group")Router.render()})
    .subscribe()
}
function setupPresence(){
  const ch=State.client.channel("challenge-presence",{config:{presence:{key:State.member.id}}});
  ch.on("presence",{event:"sync"},()=>{State.presence=ch.presenceState();if(State.route==="group")Router.render()})
    .subscribe(async status=>{if(status==="SUBSCRIBED")await ch.track({member_id:State.member.id,name:State.member.display_name,online_at:new Date().toISOString()})})
}
async function refreshFeed(){
  const {data}=await State.client.from("posts").select("id,member_id,body,photo_path,created_at,members(display_name,avatar_emoji)").order("created_at",{ascending:false}).limit(50);
  State.posts=data||[];await hydratePhotos()

function eventIcon(t){return({post:"💬",round_completed:"🛡️",therapy_completed:"🧠",slip_shared:"🌱"}[t]||"✨")}
function renderPosts(){
  if(!State.posts.length)return`<div class="card" style="text-align:center;color:var(--muted)">Ainda não há publicações. Alguém precisa começar.</div>`;
  return State.posts.map(p=>{

  }).join("")
}

async function toggleTherapy(day){
  if(!startReached()||day>dayNumber()){UI.toast("Esse exercício ainda não foi liberado.");return}
  const old=ownTherapyFor(day),completed=!old?.completed;
  const payload={member_id:State.member.id,day_number:day,completed,completed_at:completed?new Date().toISOString():null};
  const {error}=await State.client.from("therapy_progress").upsert(payload,{onConflict:"member_id,day_number"});
  if(error){UI.toast(error.message);return}
  const idx=State.therapy.findIndex(x=>x.day_number===day);if(idx>=0)State.therapy[idx]={...State.therapy[idx],...payload};else State.therapy.push(payload);
  if(completed)UI.reward("+20 XP","🧠");Router.render()
}
function openCraving(){
  UI.modal("Quanto está a vontade?",`<form id="cravingStartForm" class="form"><div class="formRow"><label>Intensidade agora</label><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="intensity" value="${n}" ${n===3?"checked":""}><span>${n}</span></label>`).join("")}</div></div><div class="formRow"><label>Gatilho principal</label><select class="input" id="trigger">${TRIGGERS.map(t=>`<option>${Util.esc(t)}</option>`).join("")}</select></div><button class="btn btnGreen btnBlock">Receber desafio</button></form>`);
  document.getElementById("cravingStartForm").onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.currentTarget),intensity=Util.num(fd.get("intensity"),3),trigger=document.getElementById("trigger").value;
    const {data,error}=await State.client.from("craving_sessions").insert({member_id:State.member.id,intensity,trigger,status:"active"}).select().single();
    if(error){UI.toast(error.message);return}State.activeSession=data;UI.close();await beginRound(1)
  }
}
async function beginRound(roundNo){
  const dur=challengeDuration(roundNo),ex=exerciseFor(roundNo,State.activeSession.intensity);
  const {data,error}=await State.client.from("challenge_rounds").insert({craving_session_id:State.activeSession.id,member_id:State.member.id,round_no:roundNo,duration_minutes:dur,exercise_key:ex.key,started_at:new Date().toISOString()}).select().single();
  if(error){UI.toast(error.message);return}
  State.activeRound=data;State.timerEnd=Date.now()+dur*60000;showTimer(ex,dur)
}
function showTimer(ex,dur){
  UI.modal(`Só mais ${dur} minuto${dur===1?"":"s"}`,`<div class="challengePanel"><div class="exerciseIcon">${ex.icon}</div><h3 style="margin:5px 0">${Util.esc(ex.title)}</h3><div class="exerciseText">${Util.esc(ex.text)}</div><div class="timer"><div><strong id="timerText">${String(dur).padStart(2,"0")}:00</strong><small>sem fumar por enquanto</small></div></div><div class="notice">Seu único compromisso agora é esperar o cronômetro e fazer o exercício. Quando terminar, você decide o próximo passo.</div></div>`);
  clearInterval(State.timerId);
  const tick=()=>{
    const left=Math.max(0,State.timerEnd-Date.now()),sec=Math.ceil(left/1000),m=Math.floor(sec/60),s=sec%60;
    const t=document.getElementById("timerText");if(t)t.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    if(left<=0){clearInterval(State.timerId);showRoundOutcome()}
  };
  tick();State.timerId=setInterval(tick,500)
}
function showRoundOutcome(){
  clearInterval(State.timerId);
  UI.modal("Você atravessou este bloco",`<div class="challengePanel"><div class="exerciseIcon">🛡️</div><h3>E a vontade agora?</h3><p class="exerciseText">Escolha o que está acontecendo de verdade. Se ela ainda estiver forte, faremos outro bloco curto.</p><div class="actions"><button class="btn btnGreen" data-outcome="resisted">Diminuiu / passou</button><button class="btn btnBlue" data-outcome="still_craving">Ainda está forte</button><button class="btn btnGhost" data-outcome="smoked">Eu fumei</button></div></div>`);
  document.querySelectorAll("[data-outcome]").forEach(b=>b.onclick=()=>finishRound(b.dataset.outcome))
}
async function finishRound(outcome){
  const {error}=await State.client.from("challenge_rounds").update({completed_at:new Date().toISOString(),outcome}).eq("id",State.activeRound.id);
  if(error){UI.toast(error.message);return}
  const current=State.activeRound.round_no;
  if(outcome==="resisted"){
    await State.client.from("craving_sessions").update({status:"completed",completed_rounds:current,updated_at:new Date().toISOString()}).eq("id",State.activeSession.id);
    UI.close();UI.reward(`+10 XP · ${State.activeRound.duration_minutes} min vencidos`,"🛡️");State.activeRound=null;State.activeSession=null;await loadAll();Router.go("today")
  }else if(outcome==="still_craving"){
    await State.client.from("craving_sessions").update({completed_rounds:current,updated_at:new Date().toISOString()}).eq("id",State.activeSession.id);
    UI.close();await beginRound(current+1)
  }else{
    await State.client.from("craving_sessions").update({status:"smoked",completed_rounds:Math.max(0,current-1),updated_at:new Date().toISOString()}).eq("id",State.activeSession.id);
    UI.close();openSlip(true)
  }
}
function openSlip(fromSession=false){
  UI.modal("Registrar sem se punir",`<form id="slipForm" class="form"><div class="notice">O objetivo é descobrir o gatilho e voltar ao plano. Um deslize não precisa virar abandono.</div><div class="formRow"><label>O que aconteceu?</label><select class="input" id="slipTrigger">${TRIGGERS.map(t=>`<option>${Util.esc(t)}</option>`).join("")}</select></div><div class="formRow"><label>Observação</label><textarea class="input" id="slipNote" placeholder="O que posso fazer diferente na próxima vontade?"></textarea></div><label style="display:flex;gap:9px;align-items:flex-start"><input id="shareSlip" type="checkbox" style="width:20px;height:20px;accent-color:var(--green)"> <span style="font-size:.82rem;color:var(--muted)">Compartilhar no grupo apenas que tive um deslize e retomei o desafio (sem compartilhar minha observação).</span></label><button class="btn btnGreen">Registrar e continuar</button></form>`);
  document.getElementById("slipForm").onsubmit=async e=>{
    e.preventDefault();
    const {error}=await State.client.from("slips").insert({member_id:State.member.id,trigger:document.getElementById("slipTrigger").value,note:document.getElementById("slipNote").value.trim(),share_to_feed:document.getElementById("shareSlip").checked});
    if(error){UI.toast(error.message);return}UI.close();UI.toast("Registrado. O próximo minuto já é uma nova decisão.");State.activeRound=null;State.activeSession=null;await loadAll();Router.go("today")
  }
}
async function publishPost(){
  const body=document.getElementById("postBody").value.trim();
  if(!body&&!State.selectedPhoto){UI.toast("Escreva algo ou escolha uma foto.");return}
  let path=null;
  if(State.selectedPhoto){
    const ext=(State.selectedPhoto.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    path=`${State.member.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext||"jpg"}`;
    const {error}=await State.client.storage.from(APP.photoBucket).upload(path,State.selectedPhoto,{cacheControl:"3600",upsert:false});
    if(error){UI.toast("Falha ao enviar foto: "+error.message);return}
  }
  const {error}=await State.client.from("posts").insert({member_id:State.member.id,body,photo_path:path});
  if(error){if(path)await State.client.storage.from(APP.photoBucket).remove([path]);UI.toast(error.message);return}
  State.selectedPhoto=null;UI.reward("+5 XP · publicado","💬");await refreshFeed();Router.render()
}
async function toggleSupport(postId){
  const mine=State.reactions.find(r=>r.post_id===postId&&r.member_id===State.member.id&&r.kind==="support");
  if(mine){await State.client.from("post_reactions").delete().eq("id",mine.id)}else{await State.client.from("post_reactions").insert({post_id:postId,member_id:State.member.id,kind:"support"})}
  await refreshReactions();Router.render()
}
async function deletePost(postId){
  const p=State.posts.find(x=>x.id===postId);if(!p||p.member_id!==State.member.id)return;
  if(!confirm("Excluir esta publicação?"))return;
  const {error}=await State.client.from("posts").delete().eq("id",postId);if(error){UI.toast(error.message);return}
  if(p.photo_path)await State.client.storage.from(APP.photoBucket).remove([p.photo_path]);
  await refreshFeed();Router.render()
}
async function saveProfile(){
  const payload={baseline_cigs_per_day:Util.num(document.getElementById("baselineCigs").value),pack_price:Util.num(document.getElementById("packPrice").value),cigarettes_per_pack:Math.max(1,Util.num(document.getElementById("packCount").value,20)),avatar_emoji:document.getElementById("avatarEmoji").value.trim().slice(0,4)||"🌿"};
  const {data,error}=await State.client.from("members").update(payload).eq("id",State.member.id).select().single();if(error){UI.toast(error.message);return}State.member={...State.member,...data};UI.toast("Perfil atualizado.");await loadAll();Router.render()
}
function bindView(route){
  if(route==="feed"){
    document.getElementById("postForm").onsubmit=e=>{e.preventDefault();publishPost()};
    document.getElementById("pickPhoto").onclick=()=>document.getElementById("photoInput").click()
  }
  if(route==="group")document.getElementById("profileForm").onsubmit=e=>{e.preventDefault();saveProfile()}
}
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-route]");if(r){Router.go(r.dataset.route);return}
  if(e.target.closest("[data-close]")){UI.close();return}
  if(e.target.id==="modalBg"){UI.close();return}
  const a=e.target.closest("[data-action]");if(!a)return;
  if(a.dataset.action==="new-craving")openCraving();
  else if(a.dataset.action==="therapy-toggle")toggleTherapy(Util.num(a.dataset.day));
  else if(a.dataset.action==="slip")openSlip(false);
  else if(a.dataset.action==="support")toggleSupport(a.dataset.post);
  else if(a.dataset.action==="delete-post")deletePost(a.dataset.post)
});
document.getElementById("photoInput").addEventListener("change",e=>{
  const f=e.target.files?.[0];e.target.value="";if(!f)return;
  if(!f.type.startsWith("image/")){UI.toast("Escolha uma imagem.");return}
  if(f.size>7*1024*1024){UI.toast("Use uma imagem de até 7 MB.");return}
  State.selectedPhoto=f;
  const p=document.getElementById("photoPreview");if(p){p.src=URL.createObjectURL(f);p.classList.remove("hidden")}
});
document.getElementById("themeBtn").onclick=()=>{const n=(localStorage.getItem(APP.themeKey)||"light")==="dark"?"light":"dark";localStorage.setItem(APP.themeKey,n);applyTheme()};
document.getElementById("logoutBtn").onclick=logout;
window.addEventListener("hashchange",()=>{if(State.member)Router.render()});

async function boot(){
  applyTheme();
  if(!initClient()){renderSetup();return}
  const {data:{session}}=await State.client.auth.getSession();
  State.user=session?.user||null;
  State.client.auth.onAuthStateChange((_event,session)=>{State.user=session?.user||null});
  if(!State.user){renderAuth();return}
  try{await bootAuthenticated()}catch(err){console.error(err);UI.toast("Falha ao carregar o desafio: "+(err.message||"erro"))}
}
boot();
</script>
</body>
</html>
